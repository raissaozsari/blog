baseURL = "https://lightbi-beta-demo.netlify.app/"
locale = "es"
title = "Raissa Ozsari"
theme = "lightbi-hugo"
summaryLength  = "30"
metaDataFormat = "yaml"
pygmentsStyle = "trac"
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
pygmentsUseClassic = true
pygmentOptions = "linenos=inline"
#googleAnalytics = "XXX"
enableRobotsTXT = true
enableGitInfo = false
ignoreLogs = ['warning-goldmark-raw-html']
languageCode = "es"
defaultContentLanguage = "es"


[Params]
selfHosted = true
mainSections = ["posts"]
dateFormat = "02 January 2006"
comments = false
readingTime = false
wordCount = false
hideAuthor = false
useHLJS = true
socialShare = true
delayDisqus = true
showRelatedPosts = true 
gcse = false
Lastmod = false
rss = true 
pagination = "10"
description="Blog de arte y ayuda para nuevos dibujantes y artistas que buscan su camino."
lunrSearch = true
previewCardImagePlacement = "top"
hidePostImage = false
tagSubtitle = "Here, you’ll discover the latest notes that explore new insights, and unique perspectives on the world."
homepageLayout = "profile" #blog
profileWelcomeHeading = "¡Hola!"
profileWelcomeSubHeading = "¡Bienvenido a mis pensamientos artísticos!"
profileShortbio = "Comparto ideas y todo lo que he descubierto en mi camino en el arte, que espero sean de ayuda en el descubrimiento del tuyo."
profilePhoto = "img/profile/home-profile-pic.jpg"

[pagination]
pagerSize = 9



[Params.Author]
  name = "Raissa Ozsari"
  website = "https://www.binovarghese.com/"
  authorInfo = "Give everything for your dreams."
  authorPostImage = "/img/author-post-img.jpg"
  facebook = "OzsariRaissa"
  instagram = "RaissaOzsari"
  youtube = "user/username" # or channel/channelname
  twitter = "RaissaOzsari"
  reddit = "username"
  paypal = "username"
  telegram = "username"

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"


[[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

[[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2

[[menu.main]]
    name = "Notes"
    url = "/notes/"
    weight = 3

[[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 4


[[menu.main]]
    name = "About"
    url = "/about/"
    weight = 6


